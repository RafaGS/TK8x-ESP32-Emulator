[env:esp32dev]
platform = espressif32@53.3.13
board = esp32dev
framework = arduino
monitor_speed = 115200
build_flags =
  -std=gnu++17
  -DCORE_DEBUG_LEVEL=3
  -I.
  -DCONFIG_ASYNC_TCP_RUNNING_CORE=0
board_build.filesystem = littlefs
lib_deps =
  me-no-dev/ESPAsyncWebServer@3.6.0
  ESP32Async/AsyncTCP@3.5.0
  bblanchon/ArduinoJson@7.4.3

; Igual que esp32dev pero conectando al SSID de include/secrets.h en lugar de crear un AP.
[env:esp32dev_sta]
extends = env:esp32dev
build_flags =
  ${env:esp32dev.build_flags}
  -DTK80_WIFI_STA

[env:native]
platform = native
build_flags =
    -std=c++17
    -Iinclude
    -Wall
    -Wextra
    -DSYS2_BAUD=115200
    -DHOST=Linux
    -fpermissive
build_src_flags =
    -Wall
    -Wextra
lib_deps =
    https://github.com/pschatzmann/Arduino-Emulator.git
